<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RVK Frivillig">
  <title>RVK Frivillig</title>

  <defs>
    <linearGradient id="rvk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0F4C3A"/>
      <stop offset="60%"  stop-color="#1B8A5A"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Fuld baggrund. Maskable-ikoner beskæres til cirkel, firkant eller
       squircle afhængigt af telefonen, så baggrunden skal gå helt ud til
       kanten, og motivet skal holde sig inden for de midterste ~80 %. -->
  <rect width="512" height="512" fill="url(#rvk)"/>

  <!-- Volleyballen — samme streg som appen selv tegner på login-skærmen.
       Tegnet i et 100×100-koordinatsystem og skaleret til 330 px, så den
       fylder ca. 54 % af fladen og overlever selv den hårdeste beskæring. -->
  <g transform="translate(91 91) scale(3.3)"
     fill="none" stroke="#FFFFFF" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="42"/>
    <path d="M50 8 Q 22 50 50 92"/>
    <path d="M50 8 Q 78 50 50 92"/>
    <path d="M8 50 Q 50 22 92 50"/>
    <path d="M8 50 Q 50 78 92 50"/>
  </g>
</svg>
